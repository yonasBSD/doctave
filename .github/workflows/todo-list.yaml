name: Todo List

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]


jobs:
  todo-list-summary:
    name: Remaining Todos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Cocogitto
        run: cargo binstall -y todo-tree

      - name: List Todos
        run: |
          SUMMARY_FILE=$GITHUB_STEP_SUMMARY
          TODO_OUTPUT=$(todo-tree list)

          # Check if output is empty and provide a clear success message if so.
          if [ "$TODO_OUTPUT" = "No TODO items found." ]; then
            echo "## 🌳 TODO-Tree Code Review Report" >> $SUMMARY_FILE
            echo "" >> $SUMMARY_FILE
            echo "✅ **Success**" >> $SUMMARY_FILE
            exit 0
          fi

          # 1. Add a descriptive Markdown header to the Summary page
          echo "## 🌳 TODO-Tree Code Review Report" >> $SUMMARY_FILE
          echo "" >> $SUMMARY_FILE

          # 2. Append the raw output directly (preserves ANSI colors)
          todo-tree list --case-sensitive >> $SUMMARY_FILE
          todo-tree stats >> $SUMMARY_FILE

  todo-list-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Required for changed-only and new-only modes

      - name: Scan for TODOs
        uses: alexandretrotel/todo-tree-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tags: "TODO,FIXME,BUG,HACK"
          include-patterns: "*.rs,*.ts"
          exclude-patterns: "*.test.ts"
          changed-only: true
          new-only: false
          fail-on-todos: false
          fail-on-fixme: true
          max-todos: 50
          show-annotations: true
          max-annotations: 50
          post-comment: true
          comment-header: "## TODO Report"

      - name: Use outputs
        run: |
          echo "Total TODOs: ${{ steps.todos.outputs.total }}"
          echo "Files with TODOs: ${{ steps.todos.outputs.files_count }}"
          echo "Has TODOs: ${{ steps.todos.outputs.has_todos }}"
